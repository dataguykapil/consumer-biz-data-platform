[project]
name = "cdp"
version = "0.1.0"
description = "Consumer data platform lakehouse"
requires-python = ">=3.10"
dependencies = [
    # Pinned to the newest Spark line that has a matching Iceberg runtime
    # (iceberg-spark-runtime-4.1_2.13:1.11.0). Keep these two in lockstep.
    "pyspark==4.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
