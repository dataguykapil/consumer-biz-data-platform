# Git hooks. Install once with `make hooks`.
#   on commit: fast hygiene, lint/format, secret scan
#   on push:   bandit + the full test suite (about 40 s)
# CI runs the same config (`pre-commit run --all-files`), so local and CI checks cannot drift.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: bandit
        name: bandit (security lint)
        entry: .venv/bin/bandit -c pyproject.toml -r src -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pytest
        name: pytest (full suite)
        entry: make test ARGS=-q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
